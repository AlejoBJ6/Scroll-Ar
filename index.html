<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="./css/style.css">
  <title>Documento</title>
</head>
<body>
  <header class="container-fluid">
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container color-li">
        <a href="./index.html" class="navbar-brand">Proyect-G4</a>
        <button class="navbar-toggler border" data-bs-toggle="collapse" data-bs-target="#opciones-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="opciones-menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item color-li">
              <a class="nav-link active" href="./index.html">Inicio</a>
            </li>
            <li class="nav-item color-li">
              <a class="nav-link" href="./pages/grilla.html"> Login</a>
            </li>
            <li class="nav-item color-li">
              <a class="nav-link" href="#">Acerca de nosotros</a>
            </li>
            <li class="nav-item color-li">
              <a class="nav-link" href="./pages/contactos.html">Contactos</a>
            </li>
            <li class="nav-link nav-item mx-md-2 my-2 my-lg-0">
              <button class="btn btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#newsletterModal">
                Suscribite
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- zona del modal de Suscribite -->
    <div class="modal fade" id="newsletterModal" tabindex="-1" aria-labelledby="newsletterModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <!-- HEADER DEL MODAL -->
          <div class="modal-header">
            <h5 class="modal-title" id="newsletterModalLabel">
              Suscribite a nuestro Newsletter y recibí todas nuestras novedades
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <!-- BODDY DEL MODAL -->
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="emailNewsletter" class="form-label">
                  Correo electrónico
                </label>
                <input type="email" class="form-control" id="emailNewsletter" placeholder="nombre@email.com" />
              </div>
              <button type="submit" class="btn btn-warning w-100">
                Suscribirme
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <!-- Slider Principal (Carousel estándar de Bootstrap) -->
    <div id="carouselCaption" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="0" class="active" aria-current="true"
          aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <!-- Diapositivas -->
      <div class="carousel-inner">
        <!-- Diapositiva 1 -->
        <div class="carousel-item active">
          <img src="./img/general/image.png" class="d-block w-100 carouselImg" alt="imagen de prueba">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
        <!-- Diapositiva 2 -->
        <div class="carousel-item">
          <img src="#" class="d-block w-100 carouselImg" alt="">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
        <!-- Diapositiva 3 -->
        <div class="carousel-item">
          <img src="#" class="d-block w-100 carouselImg" alt="">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
      </div>
      <!-- Controles de navegación -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselCaption" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselCaption" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </main>
  <footer class="bckfooter py-5">
    <div class="container-fluid">
      <div class="row">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
