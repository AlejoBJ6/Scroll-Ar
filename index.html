<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Proyecto final del modulo de Frontend de Rolling Code"
    />
    <meta name="author" content="Acuña Alejo, Cid Lucas, Roda Gabriel" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Documento</title>
  </head>
  <body>
    <header class="container-fluid">
      <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container color-li">
          <a href="./index.html" class="navbar-brand">Proyect-G4</a>
          <button
            class="navbar-toggler border"
            data-bs-toggle="collapse"
            data-bs-target="#opciones-menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="opciones-menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item color-li">
                <a class="nav-link active" href="./index.html">Inicio</a>
              </li>
              <li class="nav-item color-li">
                <a class="nav-link" href="./pages/grilla.html"> Login</a>
              </li>

              <li class="nav-item color-li">
                <a class="nav-link" href="#">Acerca de nosotros</a>
              </li>
              <li class="nav-item color-li">
                <a class="nav-link" href="./pages/contactos.html">Contactos</a>
              </li>
              <li class="nav-link nav-item mx-md-2 my-2 my-lg-0">
                <button
                  class="btn btn-warning fw-bold"
                  data-bs-toggle="modal"
                  data-bs-target="#newsletterModal"
                >
                  Suscribite
                </button>
              </li>
            </ul>
          </div>
          <!-- boton suscribite -->
        </div>
      </nav>
      <!-- zona del modal de Suscribite -->
      <div
        class="modal fade"
        id="newsletterModal"
        tabindex="-1"
        aria-labelledby="newsletterModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <!-- HEADER DEL MODAL -->

            <div class="modal-header">
              <h5 class="modal-title" id="newsletterModalLabel">
                Suscribite a nuestro Newsletter y recibí todas nuestras
                novedades
              </h5>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <!-- BODY DEL MODAL -->

            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="emailNewsletter" class="form-label">
                    Correo electrónico
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    id="emailNewsletter"
                    placeholder="nombre@email.com"
                  />
                </div>

                <button type="submit" class="btn btn-warning w-100">
                  Suscribirme
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
