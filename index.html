<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Proyecto final del modulo de Frontend de Rolling Code">
  <meta name="author" content="Acuña Alejo, Cid Lucas, Roda Gabriel">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
  <title>Documento</title>
</head>
<body>
  <header></header>
  <main>
    <!-- Slider Principal (Carousel estándar de Bootstrap) -->
    <div id="carouselCaption" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselCaption" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <!-- Diapositivas -->
      <div class="carousel-inner">
        <!-- Diapositiva 1 -->
        <div class="carousel-item active">
          <img src="./img/general/image.png" class="d-block w-100 carouselImg" alt="imagen de prueba">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
        <!-- Diapositiva 2 -->
        <div class="carousel-item">
          <img src="#" class="d-block w-100 carouselImg" alt="">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
        <!-- Diapositiva 3 -->
        <div class="carousel-item">
          <img src="#" class="d-block w-100 carouselImg" alt="">
          <a href="#" class="btn btnDetail">Ver detalle</a> <!-- me quedo el href vacio hasta que tengamos el error 404 -->
        </div>
      </div>
      <!-- Controles de navegación -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselCaption" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselCaption" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </main>
  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
